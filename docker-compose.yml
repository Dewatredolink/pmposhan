services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pmposhan
      POSTGRES_USER: pmposhan
      POSTGRES_PASSWORD: pmposhan
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmposhan -d pmposhan"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pmposhan
      MINIO_ROOT_PASSWORD: change-this-minio-password
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/keycloak/pmposhan-realm.json:/opt/keycloak/data/import/pmposhan-realm.json:ro
    ports:
      - "8080:8080"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://pmposhan:pmposhan@db:5432/pmposhan
      KEYCLOAK_ISSUER: http://localhost:8080/realms/pmposhan
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/pmposhan/protocol/openid-connect/certs
      KEYCLOAK_WEB_CLIENT_ID: pmposhan-web
      AUTH_REQUIRED: "true"
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
      VITE_KEYCLOAK_URL: http://localhost:8080
      VITE_KEYCLOAK_REALM: pmposhan
      VITE_KEYCLOAK_CLIENT_ID: pmposhan-web
    depends_on:
      - backend
      - keycloak
    ports:
      - "5173:5173"

volumes:
  pgdata:
  miniodata:
