services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pmposhan}
      POSTGRES_USER: ${POSTGRES_USER:-pmposhan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmposhan -d pmposhan"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}

      KC_HOSTNAME: localhost
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"

      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"

    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pmposhan}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pmposhan}

      KEYCLOAK_ISSUER: http://localhost:8080/realms/pmposhan
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/pmposhan/protocol/openid-connect/certs
      KEYCLOAK_WEB_CLIENT_ID: pmposhan-web

      AUTH_REQUIRED: "true"

      LICENSE_PUBLIC_KEY_B64: ${LICENSE_PUBLIC_KEY_B64:-}

      CORS_ORIGINS: http://localhost:5173

    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started

    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
      VITE_KEYCLOAK_URL: http://localhost:8080
      VITE_KEYCLOAK_REALM: pmposhan
      VITE_KEYCLOAK_CLIENT_ID: pmposhan-web

    depends_on:
      - backend
      - keycloak

    ports:
      - "5173:5173"

volumes:
  pgdata:
  miniodata:
  pmposhan_keycloak_data:
    external: true