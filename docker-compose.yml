services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pmposhan}
      POSTGRES_USER: ${POSTGRES_USER:-pmposhan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmposhan -d pmposhan"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - miniodata:/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}

      KC_HOSTNAME: https://localhost:8443/auth
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_ENABLED: "true"

      KC_PROXY_HEADERS: xforwarded

      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"

    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pmposhan}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pmposhan}

      KEYCLOAK_ISSUER: https://localhost:8443/auth/realms/pmposhan
      KEYCLOAK_JWKS_URL: http://keycloak:8080/auth/realms/pmposhan/protocol/openid-connect/certs
      KEYCLOAK_WEB_CLIENT_ID: pmposhan-web

      AUTH_REQUIRED: "true"

      LICENSE_PUBLIC_KEY_B64: ${LICENSE_PUBLIC_KEY_B64:-}

      CORS_ORIGINS: https://localhost:8443

    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: https://localhost:8443/api/v1
      VITE_KEYCLOAK_URL: https://localhost:8443/auth
      VITE_KEYCLOAK_REALM: pmposhan
      VITE_KEYCLOAK_CLIENT_ID: pmposhan-web

    depends_on:
      - backend
      - keycloak

  nginx:
    image: nginx:1.27-alpine

    depends_on:
      - frontend
      - backend
      - keycloak

    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro

    ports:
      - "8088:80"
      - "8443:443"

volumes:
  pgdata:
  miniodata:

  # Kept only as an emergency rollback source from the former H2 setup.
  pmposhan_keycloak_data:
    external: true