[package]
name = "pmposhan-standalone"
version = "1.0.0"
description = "PM POSHAN Standalone Windows Application"
authors = ["Dewa Tredolink"]
edition = "2021"

[lib]
name = "pmposhan_standalone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
